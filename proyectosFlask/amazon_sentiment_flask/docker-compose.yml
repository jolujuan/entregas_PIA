# Versión de Docker Compose
version: "3.8"

# Definición de servicios
services:
  # Servicio de la API
  api:
    # Nombre del contenedor
    container_name: sentiment-api
    # Imagen a construir o usar
    image: sentiment-api-app
    # Configuración de la construcción del contenedor
    build:
      # Contexto: el directorio actual (donde está este yml)
      context: .
      # El Dockerfile a usar
      dockerfile: Dockerfile
    # Mapeo de puertos: [Puerto del Host]:[Puerto del Contenedor]
    ports:
      - "5000:5000"
    # Montar volúmenes
    # Esto es útil para desarrollo: los cambios en tu código local
    # se reflejan inmediatamente dentro del contenedor sin re-build.
    # Para producción, deberías quitar esta línea y hacer re-build.
    volumes:
      - .:/app
      # Volumen para el modelo, para que no se pierda al reiniciar
      # y para que train.py pueda escribir en él.
      - ./models:/app/models
      # Volumen para el cache de kaggle, para no descargar el dataset cada vez
      - ~/.cache/kagglehub:/root/.cache/kagglehub